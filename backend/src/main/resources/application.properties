spring.application.name=Twix

# Vercel routes to port 80 unless PORT is set in the project settings.
server.port=${PORT:80}

# Supplied by the environment. Never write real values here.
spring.datasource.url=${TWIX_DB_URL}
spring.datasource.username=${TWIX_DB_USER}
spring.datasource.password=${TWIX_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.web.cors.allowed-origin-patterns=*
