spring.application.name=Twix

# Vercel routes to port 80 unless PORT is set in the project settings.
server.port=${PORT:80}

# The DataSource is assembled in config/DataSourceConfig.java, which accepts
# either a jdbc: URL or a provider-native postgresql:// URL and normalises it.
# Values come from TWIX_DB_URL, TWIX_DB_USER and TWIX_DB_PASSWORD.

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.web.cors.allowed-origin-patterns=*

# Build beans on first use rather than all of them during startup. The cost is
# that the first request touching a bean pays for creating it; the benefit is
# that the application binds its port sooner, which is what decides whether the
# platform considers it started at all.
spring.main.lazy-initialization=true
